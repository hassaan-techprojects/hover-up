name: Storefront Pack Pricing Checks

on:
  push:
    branches:
      - feat/storefront-pack-pricing
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hoverup
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hoverup
      NEXTAUTH_SECRET: pack-pricing-ci-validation-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint (pack pricing changes)
        run: >
          npx eslint
          "app/cart/page.tsx"
          "app/shop/[slug]/product-detail-client.tsx"
          "app/dashboard/(workspace)/products/page.tsx"
          "app/dashboard/(workspace)/products/[id]/pricing/page.tsx"
          "app/api/orders/route.ts"
          "app/api/dashboard/products/[id]/pack-pricing/route.ts"
