name: Hover Up CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "v0/client-readiness-fixes"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client and build
        run: npm run build
      - name: Audit ESLint findings
        run: npm run lint
        continue-on-error: true
        env:
          NEXTAUTH_SECRET: ci-build-only-placeholder
          NEXTAUTH_URL: http://localhost:3000
