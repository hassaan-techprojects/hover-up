name: Hover Up Commerce Checks

on:
  push:
    branches:
      - feat/storefront-commerce-orders
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hoverup
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hoverup
      NEXTAUTH_SECRET: commerce-ci-validation-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
